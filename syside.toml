# Syside workspace configuration.
#
# The SYSMOD library is external reference material and is not part of this
# repository. It is included as a Git submodule pinned to a specific upstream
# revision (see references/README.md) and is loaded as an external library so
# that it is available for resolution but is not validated together with the
# product model.
# The remaining reference material is excluded from the workspace.
include = ["references/sysmod-sysmlv2/SYSMOD.sysml"]
exclude = ["references/**"]
